[package]
name = "din-drive"
version = "0.1.0"
edition = "2024"

[dependencies]
aes-gcm = "0.10"
anyhow = "1.0.104"
base64 = "0.23.1"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
dirs = "7.0.0"
fuser = { version = "0.18.0", default-features = false }
futures-util = "0.3.34"
hex = "0.4.3"
hmac = "0.12"
libc = "0.2.191"
nostr = { version = "0.45", features = ["nip44", "nip59", "os-rng"] }
nostr-sdk = "0.45"
rustls = { version = "0.23", default-features = false, features = ["std", "aws_lc_rs"] }
rand = "0.8"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "json"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zeroize = "1.9.1"

[dev-dependencies]
axum = "0.8.9"
nostr-sdk = { version = "0.45", features = ["local-relay"] }
tempfile = "3.27.0"
